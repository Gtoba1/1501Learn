name: shoplink-week4

# Week 4 lakehouse stack. Every image here is free and open source.
# Core profile (default): MinIO, Spark cluster, Kafka, Jupyter driver.
# Governance profile (section 5): Unity Catalog, Marquez.
#   docker compose up -d                      # core only
#   docker compose --profile governance up -d # core + governance

x-spark-env: &spark-env
  SPARK_NO_DAEMONIZE: "true"

services:
  # ---------------------------------------------------------------- storage
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shoplink
      MINIO_ROOT_PASSWORD: shoplink123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console, log in with shoplink / shoplink123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the three medallion buckets. OpenTofu does the same job in
  # section 4 -- this service just means the stack is usable before then.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 shoplink shoplink123 &&
      mc mb -p local/bronze local/silver local/gold &&
      echo 'buckets ready: bronze silver gold'"

  # ---------------------------------------------------------------- compute
  spark-master:
    image: apache/spark:3.5.3-python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment: *spark-env
    ports:
      - "8080:8080"   # master UI: see both workers register here
      - "7077:7077"
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker:
    image: apache/spark:3.5.3-python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    depends_on: [spark-master]
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    deploy:
      replicas: 2      # two executors, so shuffles are real network hops

  # Driver + notebooks. Built from the same Spark version as the cluster,
  # which avoids the usual "driver and executor version mismatch" failure.
  driver:
    build: ./driver
    depends_on: [spark-master, minio]
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "8888:8888"   # JupyterLab, no token
      - "4040:4040"   # Spark application UI -- the one section 2 asks you to read
    volumes:
      - ./work:/home/spark/work
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  # -------------------------------------------------------------- streaming
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ------------------------------------------------------------- governance
  unity-catalog:
    image: unitycatalog/unitycatalog:latest
    profiles: ["governance"]
    ports:
      - "8085:8080"   # UC server (8080 is taken by the Spark master UI)
    volumes:
      - uc-data:/home/unitycatalog/etc

  marquez-db:
    image: postgres:16
    profiles: ["governance"]
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db:/var/lib/postgresql/data

  marquez:
    image: marquezproject/marquez:latest
    profiles: ["governance"]
    depends_on: [marquez-db]
    ports:
      - "5000:5000"   # OpenLineage API: point Airflow and Spark here
      - "5001:5001"   # admin
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez

  marquez-web:
    image: marquezproject/marquez-web:latest
    profiles: ["governance"]
    depends_on: [marquez]
    ports:
      - "3000:3000"   # lineage graph
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000

volumes:
  minio-data:
  marquez-db:
  uc-data:
