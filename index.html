<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data & Analytics Engineering Bootcamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --ink:#1B2A3A; --muted:#5B6776; --line:#D6DCD8;
  --raw:#6E7F6A; --bronze:#A5663A; --silver:#6F8190; --gold:#B8901C;
  --done:#2F8F6B; --warn:#B4452F; --code-bg:#1E2B39; --code-ink:#E4E9EE; --focus:#2C6DB5;
  --pipe:#C9D1CC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121A22; --surface:#1A242F; --ink:#E6EBEF; --muted:#9AA7B3; --line:#2C3945;
    --raw:#94A58F; --bronze:#D08A58; --silver:#9DB0BF; --gold:#DDB443;
    --done:#4DBA90; --warn:#E07A62; --code-bg:#0E151C; --code-ink:#DCE3E9; --focus:#6FA8E8; --pipe:#34424F;
  }
}
:root[data-theme="dark"]{
  --paper:#121A22; --surface:#1A242F; --ink:#E6EBEF; --muted:#9AA7B3; --line:#2C3945;
  --raw:#94A58F; --bronze:#D08A58; --silver:#9DB0BF; --gold:#DDB443;
  --done:#4DBA90; --warn:#E07A62; --code-bg:#0E151C; --code-ink:#DCE3E9; --focus:#6FA8E8; --pipe:#34424F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(90deg,var(--raw) 0 25%,var(--bronze) 25% 50%,var(--silver) 50% 75%,var(--gold) 75%)}
.bar-spacer{flex:1}
.overall{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.overall-track{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.overall-fill{height:100%;background:var(--done);transition:width .4s}
.save-state{font-size:13px;color:var(--muted)}
@media (max-width:640px){.overall-track,.save-state{display:none}}

/* hero */
.hero{padding-block:56px 28px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:800;letter-spacing:-.02em;max-width:14ch}
.hero p.lede{font-size:19px;color:var(--muted);max-width:58ch;margin:18px 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:12px 20px;font-weight:600;text-decoration:none;background:var(--ink);color:var(--paper)}
.btn:hover{filter:brightness(1.12)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--done);color:#fff}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* pipeline — the signature element */
.pipeline{margin:44px 0 12px;position:relative}
.pipe-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.pipe-line{position:absolute;left:12.5%;right:12.5%;top:34px;height:10px;border-radius:5px;background:var(--pipe)}
.pipe-flow{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--raw),var(--bronze),var(--silver),var(--gold));transition:width .8s cubic-bezier(.2,.7,.2,1)}
.packet{position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.pipe-flow,.packet,.overall-fill{transition:none}}
.stage{position:relative;text-align:center;padding:0 8px;text-decoration:none;color:inherit;display:block}
.stage-node{width:78px;height:78px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--stage);position:relative;z-index:1;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;color:var(--stage)}
.stage.locked .stage-node{border-style:dashed;color:var(--muted);border-color:var(--line)}
.stage.done .stage-node{background:var(--stage);color:#fff}
.stage h3{font-size:18px;margin-top:14px}
.stage .layer{font-size:13px;color:var(--stage);font-weight:600}
.stage.locked .layer{color:var(--muted)}
.stage .stage-status{font-size:13px;color:var(--muted);margin-top:2px}
a.stage:hover h3{text-decoration:underline}
@media (max-width:700px){
  .pipe-row{grid-template-columns:1fr;gap:18px}
  .pipe-line{left:34px;right:auto;top:39px;bottom:39px;width:10px;height:auto}
  .pipe-flow{width:100% !important;height:var(--flow-h,0%);right:0;bottom:auto}
  .packet{display:none}
  .stage{display:grid;grid-template-columns:78px 1fr;gap:16px;text-align:left;align-items:center;padding:0}
  .stage-node{margin:0}
  .stage h3{margin-top:0}
}

/* overview */
.section-block{padding-block:40px;border-top:1px solid var(--line)}
.section-block h2{font-size:28px;margin-bottom:18px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media (max-width:860px){.two-col{grid-template-columns:1fr;gap:24px}}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:8px}
.fact{border-left:3px solid var(--line);padding:4px 0 4px 14px}
.fact strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.module-list{display:grid;gap:14px}
.module-item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--stage);border-radius:6px 12px 12px 6px;padding:18px 20px}
.module-item h3{font-size:20px}
.module-item ol{margin:10px 0 0;padding-left:20px;color:var(--muted);columns:2;column-gap:28px}
@media (max-width:600px){.module-item ol{columns:1}}
.module-item .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;color:var(--stage)}

/* module layout */
.module-layout{display:grid;grid-template-columns:290px 1fr;gap:36px;padding-block:28px 60px}
@media (max-width:900px){.module-layout{grid-template-columns:1fr;gap:18px}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
@media (max-width:900px){.rail{position:static}}
.rail-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--stage) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:600}
.rail-head h2{font-size:19px}
.rail-head .layer{font-size:13px;color:var(--stage);font-weight:600}
.steps{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:9px}
.steps li{position:relative}
.steps a,.steps .step-locked{display:block;padding:9px 10px 9px 22px;text-decoration:none;border-radius:0 8px 8px 0;font-size:15px}
.steps a:hover{background:color-mix(in srgb,var(--stage) 10%,transparent)}
.steps a[aria-current="page"]{background:color-mix(in srgb,var(--stage) 16%,transparent);font-weight:600}
.steps .step-locked{color:var(--muted);cursor:not-allowed}
.steps li::before{content:"";position:absolute;left:-7px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.steps li.done::before{background:var(--done);border-color:var(--done)}
.steps li.open::before{border-color:var(--stage);background:var(--surface)}
.steps .kind{display:block;font-size:12px;color:var(--muted);font-weight:500}
.steps .gate{margin-top:6px}
.rail-back{display:inline-block;margin-top:18px;font-size:14px;color:var(--muted)}

.content{min-width:0;max-width:760px}
.content h1{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.01em;margin:4px 0 8px}
.meta-line{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:22px}
.content h2{font-size:21px;margin:32px 0 10px}
.content p{margin:0 0 14px}
.content ul.points{padding-left:20px;margin:0 0 14px}
.content ul.points li{margin-bottom:6px}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0}
.callout.activity{border-left:5px solid var(--stage)}
.callout h3{font-size:17px;margin-bottom:6px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:18px 20px;overflow-x:auto;font:13.5px/1.55 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:12px 0 18px;tab-size:2}
.code-cap{font-size:13px;color:var(--muted);margin-top:18px}
code.inline{font:13.5px "JetBrains Mono",ui-monospace,monospace;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:1px 5px;border-radius:4px}

/* video */
.video{margin:14px 0 20px;border-radius:14px;overflow:hidden;background:var(--code-bg);border:1px solid var(--line)}
.video-frame{position:relative;aspect-ratio:16/9;width:100%}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-poster{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:22px;text-align:left;border:0;color:#fff;background:
  radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--stage) 55%,transparent),transparent 60%),
  linear-gradient(160deg,#1E2B39,#101820)}
.video-poster .play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center}
.video-poster .play::after{content:"";margin-left:6px;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.video-poster:hover .play{background:rgba(255,255,255,.26)}
.video-poster strong{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;line-height:1.25}
.video-poster span{font-size:13px;opacity:.8}
.video-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;font-size:13px;color:#C5CFD8;background:#16212C}
.video-foot a{color:#fff}

/* completion bar */
.complete-bar{margin-top:36px;padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.complete-bar p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.done-badge{display:inline-flex;align-items:center;gap:8px;color:var(--done);font-weight:600}
.done-badge::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--done);box-shadow:inset 0 0 0 4px var(--surface)}

/* test */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0}
.q.wrong{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.q.right{box-shadow:inset 4px 0 0 var(--done)}
.q legend{font-weight:600;padding:0;margin-bottom:10px}
.q fieldset{border:0;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt:hover{background:color-mix(in srgb,var(--stage) 8%,transparent)}
.opt input{margin-top:5px;accent-color:var(--stage)}
.q .explain{font-size:14px;color:var(--muted);margin-top:8px}
.result{padding:18px 20px;border-radius:12px;margin:18px 0;font-weight:500}
.result.pass{background:color-mix(in srgb,var(--done) 14%,var(--surface));border:1px solid var(--done)}
.result.fail{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid var(--warn)}

/* project */
.checklist{list-style:none;padding:0;margin:10px 0 0}
.checklist li{padding:6px 0}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{margin-top:5px;accent-color:var(--stage);width:16px;height:16px}
.field{display:block;margin:16px 0}
.field span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.field textarea{min-height:110px;resize:vertical}
.field small{color:var(--muted)}
.err{color:var(--warn);font-size:14px;margin-top:6px}

/* locked + certificate */
.lock-note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.cert{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:44px 36px;text-align:center;margin:28px 0;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,var(--raw) 0 25%,var(--bronze) 25% 50%,var(--silver) 50% 75%,var(--gold) 75%)}
.cert h1{font-size:clamp(26px,4vw,40px);margin:10px 0}
.cert .name{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(28px,5vw,46px);font-weight:800;margin:18px 0;border-bottom:2px solid var(--line);display:inline-block;padding:0 18px 6px;min-width:60%}
/* trainer */
.trainer-link{font-size:14px;font-weight:600;text-decoration:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px}
.trainer-link:hover{border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:22px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:30px;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.funnel{display:grid;gap:10px;margin:8px 0 6px}
.funnel-row{display:grid;grid-template-columns:200px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.funnel-track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.funnel-fill{height:100%;background:var(--stage)}
@media (max-width:600px){.funnel-row{grid-template-columns:1fr 60px}.funnel-track{grid-column:1/-1;grid-row:2}}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:12px}
table.roster{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
.roster th,.roster td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.roster th{font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--ink) 3%,var(--surface));white-space:nowrap}
.roster th button{background:none;border:0;padding:0;color:inherit;font-weight:600}
.roster tr:last-child td{border-bottom:0}
.roster a.who{font-weight:600}
.cell-sub{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.pill.ok{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.wait{background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--gold) 70%,var(--ink))}
.mini-bar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.mini-bar div{height:100%;background:var(--done)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:28px}
.toolbar input{font:inherit;padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:220px}
.mod-card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--stage);border-radius:6px 12px 12px 6px;padding:18px 20px;margin:16px 0}
.mod-card h3{font-size:19px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;font-size:14.5px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.review-box{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.review-box .opts{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
.review-box label.r{display:flex;gap:8px;align-items:center;cursor:pointer}
.feedback{border-radius:12px;padding:16px 18px;margin:18px 0;border:1px solid var(--line);background:var(--surface)}
.feedback.ok{border-color:var(--done)}
.feedback.warn{border-color:var(--warn)}
.feedback h3{font-size:16px;margin-bottom:4px}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Data &amp; Analytics Engineering</a>
    <span class="bar-spacer"></span>
    <a class="trainer-link" id="trainerLink" href="#/trainer" hidden>Trainer dashboard</a>
    <span class="save-state" id="saveState">Progress saved in this browser</span>
    <div class="overall" aria-label="Course progress">
      <div class="overall-track"><div class="overall-fill" id="overallFill" style="width:0%"></div></div>
      <span id="overallText">0%</span>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span>A four-week intensive built on ShopLink Distribution, one fictional Lagos electronics distributor, from first query to production platform.</span>
    <button class="linkish" id="resetBtn" type="button">Reset my progress</button>
  </div>
</footer>

<script>
/* ============================================================
   COURSE CONTENT
   ============================================================ */
const COURSE = [
{
  id:"m1", title:"Foundations", layer:"Raw layer", color:"--raw",
  summary:"Answer any business question in SQL and redesign an operational schema as a star schema with history tracking.",
  sections:[
    {
      id:"s1", title:"The data landscape and tooling", mins:90,
      intro:"Operational systems like an ERP are built for many small writes: create one order, update one status. Analytical systems are built for a few very large reads: revenue by state across three years. Data engineers move data from the first kind to the second; analytics engineers shape it so the business can trust it.",
      points:[
        "OLTP systems optimise for writes and consistency; OLAP systems optimise for scans and aggregation.",
        "Data engineers own pipelines and platforms; analytics engineers own tested business models and metrics; analysts own insight.",
        "Everything in this course runs on the ShopLink dataset: customers, products, warehouses, orders and order lines."
      ],
      setup:{
        title:"Install Docker, Git and Python before the first session",
        intro:"Every lab in this course runs inside Docker, so nothing else has to be installed natively. Do this before class starts, not during it — a room of people downloading Docker at once will cost you the first morning.",
        groups:[
          {on:"Windows 10 or 11", steps:[
            "Install Docker Desktop from docker.com/products/docker-desktop. Accept the WSL 2 prompt and restart when asked.",
            "Open Docker Desktop once and leave it running. The whale icon in the system tray must be steady, not animating.",
            "Install Git from git-scm.com, and Python 3.11 or newer from python.org, ticking 'Add Python to PATH' during setup.",
            "Run the course commands in Git Bash or PowerShell, not the old Command Prompt."
          ]},
          {on:"macOS", steps:[
            "Install Docker Desktop from docker.com, choosing the Apple silicon or Intel build that matches your Mac.",
            "Open Docker Desktop once and wait until it reports Running.",
            "Install the rest with Homebrew: brew install git python@3.11"
          ]},
          {on:"Linux (Ubuntu or Debian)", steps:[
            "Install Docker Engine and the Compose plugin from the official apt repository, following docs.docker.com/engine/install.",
            "Run: sudo usermod -aG docker $USER — then log out and back in, so docker works without sudo.",
            "Install the rest: sudo apt install git python3 python3-venv python3-pip"
          ]},
          {on:"Then check it worked", steps:[

      code:`def fetch_page(params, attempts=5):
    for i in range(attempts):
        r = requests.get(BASE_URL, params=params, timeout=30)
        if r.status_code == 429 or r.status_code >= 500:
            time.sleep(2 ** i)          # 1, 2, 4, 8, 16 seconds
            continue
        r.raise_for_status()
        return r.json()
    raise RuntimeError("Gave up after retries")

since, page, max_seen = get_watermark(), 1, get_watermark()
while body := fetch_page({"updated_since": since, "page": page})["data"]:

    page += 1
save_watermark(max_seen)   # only after all pages landed`,

      code:`class OrderLine(BaseModel):
    order_line_id: int

const PASS_MARK = 0.7;

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const LS_KEY = "shoplink-course-progress-v1";
const blank = () => ({sections:{}, tests:{}, projects:{}, learner:""});
let state = blank();
let remoteRef = null;
let saveTimer = null;
let dbNs = null, userNs = null, myId = null, myName = "", isTrainer = false;
let myReview = {};

function readLocal(){ try{ const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function writeLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function normalise(s){ const b = blank(); if(!s || typeof s!=="object") return b; return {sections:s.sections||{}, tests:s.tests||{}, projects:s.projects||{}, learner:s.learner||""}; }
function score(s){ return Object.keys(s.sections).length + Object.keys(s.projects).length*5 + Object.values(s.tests).filter(t=>t&&t.passed).length*3; }

function setSaveLabel(t){ document.getElementById("saveState").textContent = t; }

function rosterBody(){
  return {uid: myId, progress: JSON.parse(JSON.stringify(state)), lastActive: new Date().toISOString(), summary: summaryOf(state)};
}
async function pushRemote(){
  if(!remoteRef) return;
  try{ await remoteRef.set(rosterBody()); setSaveLabel("Progress saved to your account"); }
  catch(e){ remoteRef = null; setSaveLabel("Progress saved in this browser"); }
}
function save(){
  writeLocal();
  clearTimeout(saveTimer);
  if(remoteRef) saveTimer = setTimeout(pushRemote, 500);
}

async function connectStore(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    dbNs = db; userNs = user;
    if(user){
      try{ isTrainer = !!(await user.canEdit()); }catch(e){ isTrainer = false; }
      try{ myName = (await user.name()) || ""; }catch(e){}
      document.getElementById("trainerLink").hidden = !(isTrainer && db);
    }
    if(!db || !user){ render(); return; }
    const uid = await user.id();
    if(!uid){ render(); return; }
    myId = uid;
    const ref = db.doc("roster/" + uid);
    const snap = await ref.get();
    let remote = snap.exists ? normalise((snap.data() || {}).progress) : null;
    if(!remote){
      try{ const legacy = await db.doc("data/users/" + uid + "/progress").get(); if(legacy.exists) remote = normalise(legacy.data()); }catch(e){}
    }
    if(remote && score(remote) >= score(state)){ state = remote; writeLocal(); }
    remoteRef = ref;
    const trainerIdle = !snap.exists && isTrainer && score(state) === 0;  // trainers join the roster only once they start learning
    if(trainerIdle) setSaveLabel("Progress saved to your account");
    else if(!snap.exists || score(state) > score(remote || blank())) await pushRemote();
    else setSaveLabel("Progress saved to your account");
    db.doc("reviews/" + uid).onSnapshot(s=>{
      myReview = s.exists ? (s.data() || {}) : {};
      if(parse().view === "project" && !editing()) render();
    }, ()=>{});
    render();
  }catch(e){ remoteRef = null; render(); }
}

/* ============================================================
   GATING LOGIC
   ============================================================ */
const key = (m,s) => m + "." + s;
const secDone = (m,s) => !!state.sections[key(m,s)];
const testPassed = m => !!(state.tests[m] && state.tests[m].passed);
const projDone = m => !!(state.projects[m] && state.projects[m].submitted);
const modIndex = id => COURSE.findIndex(m=>m.id===id);

function moduleUnlocked(mi){ return mi===0 || projDone(COURSE[mi-1].id); }
function sectionUnlocked(mi, si){ if(!moduleUnlocked(mi)) return false; if(si===0) return true; return secDone(COURSE[mi].id, COURSE[mi].sections[si-1].id); }
function allSectionsDone(mi){ const m = COURSE[mi]; return m.sections.every(s=>secDone(m.id,s.id)); }
function testUnlocked(mi){ return moduleUnlocked(mi) && allSectionsDone(mi); }
function projectUnlocked(mi){ return testUnlocked(mi) && testPassed(COURSE[mi].id); }
function moduleSteps(mi){ return COURSE[mi].sections.length + 2; }
function moduleDoneSteps(mi){ const m = COURSE[mi]; return m.sections.filter(s=>secDone(m.id,s.id)).length + (testPassed(m.id)?1:0) + (projDone(m.id)?1:0); }
function courseDone(){ return COURSE.every(m=>projDone(m.id)); }

function nextStepHref(){
  for(let mi=0; mi<COURSE.length; mi++){
    const m = COURSE[mi];
    if(projDone(m.id)) continue;
    for(let si=0; si<m.sections.length; si++){ if(!secDone(m.id,m.sections[si].id)) return `#/m/${m.id}/s/${m.sections[si].id}`; }
    if(!testPassed(m.id)) return `#/m/${m.id}/test`;
    return `#/m/${m.id}/project`;
  }
  return "#/certificate";
}

function evalFor(p, fn){ const saved = state; state = normalise(p); try{ return fn(); } finally{ state = saved; } }
function overallPct(){ const total = COURSE.reduce((a,_,i)=>a+moduleSteps(i),0); const done = COURSE.reduce((a,_,i)=>a+moduleDoneSteps(i),0); return Math.round(done/total*100); }
function currentStep(){
  for(let mi=0; mi<COURSE.length; mi++){
    const m = COURSE[mi];
    if(projDone(m.id)) continue;
    for(let si=0; si<m.sections.length; si++){ if(!secDone(m.id,m.sections[si].id)) return {mi, label:`Module ${mi+1}, section ${si+1}: ${m.sections[si].title}`}; }
    if(!testPassed(m.id)) return {mi, label:`Module ${mi+1} test`};
    return {mi, label:`Module ${mi+1} project`};
  }
  return {mi:COURSE.length, label:"Course complete"};
}
function summaryOf(p){ return evalFor(p, ()=>({pct: overallPct(), step: currentStep().label, modulesDone: COURSE.filter(m=>projDone(m.id)).length})); }
function editing(){ const a = document.activeElement; return !!(a && $app.contains(a) && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type!=="radio" && a.type!=="checkbox"))); }

/* ============================================================
   HELPERS
   ============================================================ */
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $app = document.getElementById("app");
const hrs = mins => { const h = mins/60; return (Number.isInteger(h)?h:h.toFixed(1)) + " h"; };

function updateOverall(){
  const pct = overallPct();
  document.getElementById("overallFill").style.width = pct + "%";
  document.getElementById("overallText").textContent = pct + "%";
}

function videoBlock(v){
  const url = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id);
  return `<div class="video">
    <div class="video-frame" data-vid="${esc(v.id)}">
      <button class="video-poster" type="button" data-play="${esc(v.id)}" aria-label="Play video: ${esc(v.title)}">
        <span class="play" aria-hidden="true"></span>
        <strong>${esc(v.title)}</strong>
        <span>${esc(v.channel)} on YouTube</span>
      </button>
    </div>
    <div class="video-foot"><span>${esc(v.note||"")}</span><a href="${url}" target="_blank" rel="noopener">Open on YouTube</a></div>
  </div>`;
}

function stageStatus(mi){
  const m = COURSE[mi];
  if(projDone(m.id)) return "Completed";
  if(!moduleUnlocked(mi)) return "Unlocks after Module " + mi;
  const d = moduleDoneSteps(mi);
  return d===0 ? "Ready to start" : `${d} of ${moduleSteps(mi)} steps done`;
}

/* ============================================================
   VIEWS
   ============================================================ */
function viewHome(){
  const started = Object.keys(state.sections).length > 0;
  const completedMods = COURSE.filter(m=>projDone(m.id)).length;
  // pipeline progress: fraction across 4 stages
  const frac = COURSE.reduce((a,_,i)=>a + moduleDoneSteps(i)/moduleSteps(i), 0) / COURSE.length;
  const stages = COURSE.map((m,i)=>{
    const locked = !moduleUnlocked(i), done = projDone(m.id);
    const cls = `stage${locked?" locked":""}${done?" done":""}`;
    const inner = `<div class="stage-node" aria-hidden="true">${done?"✓":i+1}</div>
      <div><div class="layer">${esc(m.layer)}</div><h3>${esc(m.title)}</h3><div class="stage-status">${stageStatus(i)}</div></div>`;
    return locked
      ? `<div class="${cls}" style="--stage:var(${m.color})" aria-label="Module ${i+1}, ${esc(m.title)}, locked">${inner}</div>`
      : `<a class="${cls}" style="--stage:var(${m.color})" href="${firstOpenHref(i)}">${inner}</a>`;
  }).join("");

  const moduleItems = COURSE.map((m,i)=>`

function firstOpenHref(mi){
  const m = COURSE[mi];
  for(const s of m.sections){ if(!secDone(m.id,s.id)) return `#/m/${m.id}/s/${s.id}`; }
  if(!testPassed(m.id)) return `#/m/${m.id}/test`;
  return `#/m/${m.id}/project`;
}

function rail(mi, current){
  const m = COURSE[mi];
  const pct = Math.round(moduleDoneSteps(mi)/moduleSteps(mi)*100);
  const items = m.sections.map((s,si)=>{
    const done = secDone(m.id,s.id), open = sectionUnlocked(mi,si);
    const cls = done ? "done" : open ? "open" : "";
    const label = `<span class="kind">Section ${si+1} · ${hrs(s.mins)}${open?"":" · locked"}</span>${esc(s.title)}`;
    return `<li class="${cls}">${open
      ? `<a href="#/m/${m.id}/s/${s.id}" ${current===s.id?'aria-current="page"':""}>${label}${done?'<span class="sr"> (completed)</span>':""}</a>`
      : `<span class="step-locked" aria-disabled="true">${label}<span class="sr"> (locked)</span></span>`}</li>`;
  }).join("");
  const tOpen = testUnlocked(mi), pOpen = projectUnlocked(mi);
  const testLi = `<li class="gate ${testPassed(m.id)?"done":tOpen?"open":""}">${tOpen
      ? `<a href="#/m/${m.id}/test" ${current==="test"?'aria-current="page"':""}><span class="kind">Checkpoint</span>Module test</a>`
      : `<span class="step-locked" aria-disabled="true"><span class="kind">Checkpoint · locked</span>Module test</span>`}</li>`;
  const projLi = `<li class="${projDone(m.id)?"done":pOpen?"open":""}">${pOpen
      ? `<a href="#/m/${m.id}/project" ${current==="project"?'aria-current="page"':""}><span class="kind">Hands-on project</span>${esc(m.project.title)}</a>`
      : `<span class="step-locked" aria-disabled="true"><span class="kind">Hands-on project · locked</span>${esc(m.project.title)}</span>`}</li>`;
  return `<nav class="rail" aria-label="Module ${mi+1} steps">
    <div class="rail-head"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div>
      <div><div class="layer">Module ${mi+1} · ${esc(m.layer)}</div><h2>${esc(m.title)}</h2></div></div>
    <ol class="steps">${items}${testLi}${projLi}</ol>
    <a class="rail-back" href="#/">Back to course overview</a>
  </nav>`;
}

function shell(mi, current, inner){
  return `<div class="wrap module-layout" style="--stage:var(${COURSE[mi].color})">${rail(mi,current)}<article class="content">${inner}</article></div>`;
}

    <div class="meta-line"><span>Module ${mi+1}, section ${si+1} of ${m.sections.length}</span><span>About ${hrs(s.mins)} with lab</span></div>

function viewTest(mi){
  const m = COURSE[mi];
  const t = state.tests[m.id];
  if(!testUnlocked(mi)){
    return shell(mi, "test", `<h1>Module test</h1><div class="lock-note">Complete all ${m.sections.length} sections in this module to open the test.</div>`);
  }
  if(t && t.passed){
    const review = m.test.map((q,i)=>`<div class="q right"><div style="font-weight:600;margin-bottom:6px">${i+1}. ${esc(q.q)}</div><div>${esc(q.o[q.a])}</div><div class="explain">${esc(q.e)}</div></div>`).join("");
    return shell(mi, "test", `
      <div class="meta-line"><span>Module ${mi+1} checkpoint</span></div>
      <h1>Module test</h1>
      <div class="result pass">Passed with ${t.score} of ${m.test.length} (${Math.round(t.score/m.test.length*100)}%). The hands-on project is now open.</div>
      <a class="btn" href="#/m/${m.id}/project">Start the project</a>
      <h2>Answer review</h2>${review}`);
  }
  const last = t && !t.passed ? `<div class="result fail">Last attempt: ${t.score} of ${m.test.length}. You need ${Math.ceil(PASS_MARK*m.test.length)} to pass. Questions you missed are marked; review those sections and try again.</div>` : "";
  const wrongSet = new Set((t && t.wrong) || []);
  const qs = m.test.map((q,i)=>`
    <div class="q ${wrongSet.has(i)?"wrong":""}">
      <fieldset>
        <legend>${i+1}. ${esc(q.q)}${wrongSet.has(i)?' <span class="sr">(missed last attempt)</span>':""}</legend>
        ${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="q${i}" value="${oi}"><span>${esc(o)}</span></label>`).join("")}
      </fieldset>
    </div>`).join("");
  return shell(mi, "test", `
    <div class="meta-line"><span>Module ${mi+1} checkpoint</span><span>${m.test.length} questions</span><span>Pass mark ${Math.round(PASS_MARK*100)}%</span></div>
    <h1>Module test</h1>
    <p>Confirm you've understood this module's sections. Answer every question, then submit.</p>
    ${last}
    <form id="testForm" data-m="${m.id}" novalidate>${qs}
      <p class="err" id="testErr" role="alert"></p>
      <button class="btn" type="submit">Submit answers</button>
    </form>`);
}

function viewProject(mi){
  const m = COURSE[mi], p = m.project;

       <a class="btn" href="${isLast ? "#/certificate" : `#/m/${COURSE[mi+1].id}/s/${COURSE[mi+1].sections[0].id}`}">${isLast ? "View your certificate" : `Start Module ${mi+2}`}</a>`
    : "";

    <h1>${esc(p.title)}</h1>

      <p class="muted">Tick each item once it is done and committed to your repository.</p>
      <ul class="checklist">${p.deliverables.map((d,i)=>`<li><label><input type="checkbox" name="d${i}" ${checks[i]?"checked":""} ${submitted?"disabled":""}><span>${esc(d)}</span></label></li>`).join("")}</ul>
      <label class="field"><span>Repository link</span>
        <input type="url" name="repo" placeholder="https://github.com/you/shoplink-${m.id}" value="${esc(saved.repo||"")}" ${submitted?"disabled":""}>
        <small>Your instructor reviews the project from this link.</small></label>
      <label class="field"><span>What was hardest, and how did you solve it?</span>
        <textarea name="notes" ${submitted?"disabled":""}>${esc(saved.notes||"")}</textarea></label>
      <p class="err" id="projErr" role="alert"></p>

let roster = null, reviews = {}, rosterErr = null, trainerSubs = false, names = {}, filterText = "", sortKey = "progress";
function startTrainerSubs(){
  if(trainerSubs || !dbNs) return;
  trainerSubs = true;
  dbNs.collection("roster").onSnapshot(s=>{
    roster = s.docs.filter(d=>d.exists).map(d=>({id:d.id, ...(d.data()||{})}));
    resolveNames();
    if(parse().view.startsWith("trainer") && !editing()) render();
  }, e=>{ rosterErr = e && e.code || "unavailable"; render(); });
  dbNs.collection("reviews").onSnapshot(s=>{
    const next = {}; s.docs.forEach(d=>{ if(d.exists) next[d.id] = d.data() || {}; }); reviews = next;
    if(parse().view.startsWith("trainer") && !editing()) render();
  }, ()=>{});
}
async function resolveNames(){
  if(!userNs || !roster) return;
  const ids = roster.map(r=>r.id).filter(id=>!(id in names));
  if(!ids.length) return;
  try{
    const ps = await userNs.profiles(ids);
    ids.forEach(id=>{ names[id] = (ps[id] && ps[id].name) || ""; });
    if(parse().view.startsWith("trainer") && !editing()) render();
  }catch(e){}
}
function learnerName(r){ return names[r.id] || (r.progress && r.progress.learner) || ("Learner " + r.id.slice(-4)); }
function relTime(iso){
  if(!iso) return "—";
  const d = (Date.now() - new Date(iso).getTime())/1000;
  if(d < 90) return "just now";
  if(d < 3600) return Math.round(d/60) + " min ago";
  if(d < 86400) return Math.round(d/3600) + " h ago";
  const days = Math.round(d/86400); return days + (days===1?" day ago":" days ago");
}
const fmtDate = iso => iso ? new Date(iso).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "—";

function moduleCell(r, mi){
  const m = COURSE[mi], rv = (reviews[r.id]||{})[m.id];
  return evalFor(r.progress, ()=>{
    if(projDone(m.id)){
      const p = state.projects[m.id];
      if(rv && rv.status==="approved") return `<span class="pill ok">Approved</span>`;
      if(rv && rv.status==="changes" && rv.at > (p.at||"")) return `<span class="pill warn">Changes requested</span>`;
      return `<span class="pill wait">Needs review</span>`;
    }
    if(!moduleUnlocked(mi)) return `<span class="cell-sub">Locked</span>`;
    const t = state.tests[m.id];
    if(projectUnlocked(mi)) return `<span class="pill">Project open</span><span class="cell-sub">Test ${t.score}/${m.test.length}</span>`;
    if(t) return `<span class="pill ${t.passed?"":"warn"}">Test ${t.score}/${m.test.length}</span><span class="cell-sub">${t.attempts} attempt${t.attempts===1?"":"s"}</span>`;
    const n = m.sections.filter(s=>secDone(m.id,s.id)).length;
    return `<span>${n}/${m.sections.length} sections</span>`;
  });
}
function needsReview(r){
  return COURSE.filter(m=>{
    const p = r.progress && r.progress.projects && r.progress.projects[m.id];
    if(!p || !p.submitted) return false;
    const rv = (reviews[r.id]||{})[m.id];
    return !rv || (rv.at < (p.at||""));
  }).length;
}

function viewTrainer(){
  if(!isTrainer) return `<div class="wrap" style="padding:48px 20px"><h1>Trainer dashboard</h1><div class="lock-note" style="margin-top:20px">Only people who can edit this course can see the trainer dashboard.</div></div>`;
  startTrainerSubs();
  if(rosterErr) return `<div class="wrap" style="padding:48px 20px"><h1>Trainer dashboard</h1><div class="lock-note" style="margin-top:20px">Learner data couldn't load (${esc(rosterErr)}). Reload the page to try again.</div></div>`;
  if(!roster) return `<div class="wrap" style="padding:48px 20px"><h1>Trainer dashboard</h1><p class="muted">Loading learners…</p></div>`;
  const list = roster.filter(r=>r.progress);
  const weekAgo = new Date(Date.now()-7*86400000).toISOString();
  const active = list.filter(r=>(r.lastActive||"") >= weekAgo).length;
  const avg = list.length ? Math.round(list.reduce((a,r)=>a+(summaryOf(r.progress).pct),0)/list.length) : 0;
  const pending = list.reduce((a,r)=>a+needsReview(r),0);
  const finished = list.filter(r=>summaryOf(r.progress).modulesDone===COURSE.length).length;

  const funnel = COURSE.map((m,mi)=>{
    const n = list.filter(r=>evalFor(r.progress, ()=>projDone(m.id))).length;
    const pct = list.length ? Math.round(n/list.length*100) : 0;
    return `<div class="funnel-row" style="--stage:var(${m.color})"><span>Module ${mi+1}: ${esc(m.title)}</span><div class="funnel-track"><div class="funnel-fill" style="width:${pct}%"></div></div><span>${n} of ${list.length}</span></div>`;
  }).join("");

  const q = filterText.toLowerCase();
  let rows = list.filter(r=>!q || learnerName(r).toLowerCase().includes(q));
  rows.sort((a,b)=>{
    if(sortKey==="name") return learnerName(a).localeCompare(learnerName(b));
    if(sortKey==="active") return (b.lastActive||"").localeCompare(a.lastActive||"");
    if(sortKey==="review") return needsReview(b)-needsReview(a);
    return summaryOf(b.progress).pct - summaryOf(a.progress).pct;
  });
  const sortBtn = (k, label) => `<button type="button" data-sort="${k}" aria-pressed="${sortKey===k}">${label}${sortKey===k?" ▾":""}</button>`;
  const body = rows.map(r=>{
    const s = summaryOf(r.progress);
    return `<tr>
      <td><a class="who" href="#/trainer/${encodeURIComponent(r.id)}">${esc(learnerName(r))}</a>${needsReview(r)?`<span class="cell-sub">${needsReview(r)} to review</span>`:""}</td>
      <td>${s.pct}%<div class="mini-bar"><div style="width:${s.pct}%"></div></div></td>
      <td>${esc(s.step)}</td>
      ${COURSE.map((_,mi)=>`<td>${moduleCell(r,mi)}</td>`).join("")}
      <td>${relTime(r.lastActive)}</td>
    </tr>`;
  }).join("");
  const empty = !list.length
    ? `<div class="lock-note" style="margin-top:14px">No learners yet. Share this page with trainees using “Can interact” access; each appears here after their first visit.</div>`
    : (!rows.length ? `<p class="muted" style="margin-top:14px">No learners match “${esc(filterText)}”.</p>` : "");

  return `<div class="wrap" style="padding-block:36px 60px">
    <h1 style="font-size:clamp(28px,3.6vw,40px)">Trainer dashboard</h1>
    <p class="muted" style="max-width:62ch">Live progress for everyone taking the course. Only people who can edit this page see it; learners see only their own progress and your feedback.</p>
    <div class="stats">
      <div class="stat"><strong>${list.length}</strong><span>Learners enrolled</span></div>
      <div class="stat"><strong>${active}</strong><span>Active in the last 7 days</span></div>
      <div class="stat"><strong>${avg}%</strong><span>Average progress</span></div>
      <div class="stat"><strong>${pending}</strong><span>Projects awaiting review</span></div>
      <div class="stat"><strong>${finished}</strong><span>Completed the course</span></div>
    </div>
    <h2 style="font-size:21px;margin-top:28px">Module completion</h2>
    <div class="funnel">${funnel}</div>
    <div class="toolbar">
      <input type="search" id="rosterFilter" placeholder="Find a learner" value="${esc(filterText)}" aria-label="Find a learner">
      <button class="btn ghost" type="button" id="csvBtn" ${list.length?"":"disabled"}>Download CSV</button>
    </div>
    ${list.length ? `<div class="table-wrap"><table class="roster">
      <thead><tr><th>${sortBtn("name","Learner")}</th><th>${sortBtn("progress","Progress")}</th><th style="min-width:200px">Current step</th>${COURSE.map((m,i)=>`<th>M${i+1} ${esc(m.title.split(",")[0])}</th>`).join("")}<th>${sortBtn("active","Last active")}</th></tr></thead>
      <tbody>${body}</tbody></table></div>` : ""}
    ${empty}
    <p class="muted" id="csvMsg" role="status" style="margin-top:10px"></p>
  </div>`;
}

function viewTrainerDetail(uid){
  if(!isTrainer) return viewTrainer();
  startTrainerSubs();
  if(!roster) return `<div class="wrap" style="padding:48px 20px"><p class="muted">Loading learner…</p></div>`;
  const r = roster.find(x=>x.id===uid);
  if(!r || !r.progress) return `<div class="wrap" style="padding:48px 20px"><h1>Learner not found</h1><p><a href="#/trainer">Back to the dashboard</a></p></div>`;
  const s = summaryOf(r.progress);
  const cards = COURSE.map((m,mi)=>evalFor(r.progress, ()=>{
    const unlocked = moduleUnlocked(mi);
    const secs = m.sections.map(sec=>{ const at = state.sections[key(m.id,sec.id)]; return `<li>${esc(sec.title)} <span class="cell-sub" style="display:inline">${at ? "· " + fmtDate(typeof at==="string"?at:"") : "· not done"}</span></li>`; }).join("");
    const t = state.tests[m.id];
    const testTxt = t
      ? `${t.passed?'<span class="pill ok">Passed</span>':'<span class="pill warn">Not passed</span>'} ${t.score}/${m.test.length} on attempt ${t.attempts}${t.wrong && t.wrong.length ? `<span class="cell-sub">Missed on latest attempt: ${t.wrong.map(i=>esc("Q"+(i+1)+" "+m.test[i].q)).join("; ")}</span>` : ""}`
      : "Not attempted";
    const p = state.projects[m.id];
    const rv = (reviews[uid]||{})[m.id];
    let proj = "Not started";
    if(p){
      const done = (p.checks||[]).filter(Boolean).length;
      const safeRepo = /^https?:\/\//i.test(p.repo||"") ? p.repo : "";
      proj = `<dl class="kv">
        <dt>Status</dt><dd>${p.submitted ? `Submitted ${fmtDate(p.at)}` : "In progress, not submitted"}</dd>
        <dt>Deliverables</dt><dd>${done} of ${m.project.deliverables.length} ticked</dd>
        <dt>Repository</dt><dd>${safeRepo ? `<a href="${esc(safeRepo)}" target="_blank" rel="noopener noreferrer">${esc(safeRepo)}</a>` : "—"}</dd>
        <dt>Reflection</dt><dd style="white-space:pre-wrap">${p.notes ? esc(p.notes) : "—"}</dd>
      </dl>
      ${p.submitted ? `<form class="review-box" data-review="${m.id}">
        <strong>Your review</strong>${rv ? ` <span class="cell-sub" style="display:inline">· last saved ${fmtDate(rv.at)}${rv.at < (p.at||"") ? ", learner has resubmitted since" : ""}</span>` : ""}
        <div class="opts">
          <label class="r"><input type="radio" name="status" value="approved" ${rv&&rv.status==="approved"?"checked":""}> Approve</label>
          <label class="r"><input type="radio" name="status" value="changes" ${rv&&rv.status==="changes"?"checked":""}> Request changes</label>
        </div>
        <label class="field" style="margin:0 0 10px"><span>Feedback for the learner</span><textarea name="feedback" placeholder="What's strong, and what to fix">${esc(rv&&rv.feedback||"")}</textarea></label>
        <p class="err" role="alert"></p>
        <button class="btn" type="submit">Send review</button>
      </form>` : ""}`;
    }
    return `<section class="mod-card" style="--stage:var(${m.color})">
      <h3>Module ${mi+1}: ${esc(m.title)} ${!unlocked ? '<span class="pill">Locked</span>' : ""}</h3>
      <dl class="kv"><dt>Sections</dt><dd><ul style="margin:0;padding-left:18px">${secs}</ul></dd><dt>Module test</dt><dd>${testTxt}</dd></dl>
      <strong>Project: ${esc(m.project.title)}</strong>${proj==="Not started" ? `<p class="muted" style="margin:6px 0 0">Not started</p>` : proj}
    </section>`;
  })).join("");
  return `<div class="wrap" style="padding-block:36px 60px;max-width:900px">
    <a class="rail-back" style="margin:0 0 14px" href="#/trainer">Back to the dashboard</a>
    <h1 style="font-size:clamp(26px,3.4vw,38px)">${esc(learnerName(r))}</h1>
    <p class="muted">${s.pct}% complete · ${esc(s.step)} · last active ${relTime(r.lastActive)}</p>
    ${cards}
  </div>`;
}

function rosterCsv(){
  const cols = ["Learner","Progress %","Current step","Last active"];
  COURSE.forEach((m,i)=>cols.push(`M${i+1} sections`,`M${i+1} test`,`M${i+1} project`,`M${i+1} repo`,`M${i+1} review`));
  const cell = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines = [cols.map(cell).join(",")];
  (roster||[]).filter(r=>r.progress).forEach(r=>{
    const s = summaryOf(r.progress);
    const row = [learnerName(r), s.pct, s.step, r.lastActive||""];
    COURSE.forEach(m=>evalFor(r.progress, ()=>{
      const t = state.tests[m.id], p = state.projects[m.id], rv = (reviews[r.id]||{})[m.id];
      row.push(m.sections.filter(x=>secDone(m.id,x.id)).length + "/" + m.sections.length,
               t ? `${t.score}/${m.test.length}${t.passed?" passed":""}` : "",
               p ? (p.submitted ? "submitted" : "in progress") : "",
               p && p.repo || "", rv ? rv.status : "");
    }));
    lines.push(row.map(cell).join(","));
  });
  return lines.join("\r\n");
}

/* ============================================================
   ROUTER
   ============================================================ */
function parse(){
  const h = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if(h[0]==="m"){
    const mi = modIndex(h[1]);
    if(mi<0) return {view:"home"};
    if(h[2]==="s"){ const si = COURSE[mi].sections.findIndex(s=>s.id===h[3]); return si<0 ? {view:"home"} : {view:"section", mi, si}; }
    if(h[2]==="test") return {view:"test", mi};
    if(h[2]==="project") return {view:"project", mi};
    return {view:"section", mi, si:0};
  }
  if(h[0]==="certificate") return {view:"cert"};
  if(h[0]==="trainer") return h[1] ? {view:"trainerDetail", uid:decodeURIComponent(h[1])} : {view:"trainer"};
  return {view:"home"};
}

let observer = null;
function render(){
  const r = parse();
  if(observer){ observer.disconnect(); observer = null; }
  // locked routes redirect to the furthest open step
  if((r.view==="section" && !sectionUnlocked(r.mi, r.si)) || ((r.view==="test"||r.view==="project") && !moduleUnlocked(r.mi))){
    location.replace(nextStepHref()); return;
  }
  let html;
  if(r.view==="section") html = viewSection(r.mi, r.si);
  else if(r.view==="test") html = viewTest(r.mi);
  else if(r.view==="project") html = viewProject(r.mi);
  else if(r.view==="cert") html = viewCertificate();
  else if(r.view==="trainer") html = viewTrainer();
  else if(r.view==="trainerDetail") html = viewTrainerDetail(r.uid);
  else html = viewHome();
  $app.innerHTML = html;
  updateOverall();
  wire();
}

function wire(){
  // click-to-load videos
  $app.querySelectorAll("[data-play]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-play");
      const f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) + "?autoplay=1&rel=0";
      f.title = btn.getAttribute("aria-label").replace(/^Play video: /,"");
      f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      f.allowFullscreen = true;
      f.referrerPolicy = "strict-origin-when-cross-origin";
      btn.replaceWith(f);
    });
  });

  // section completion unlocks once the reader reaches the end
  const cb = document.getElementById("completeBtn");
  if(cb){
    const enable = ()=>{ cb.disabled = false; const h = document.getElementById("completeHint"); if(h) h.textContent = "You've reached the end. Mark it complete to open the next step."; };
    const sentinel = document.getElementById("endSentinel");
    if("IntersectionObserver" in window && sentinel){
      observer = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ enable(); observer.disconnect(); } });
      observer.observe(sentinel);
    } else enable();
    cb.addEventListener("click", ()=>{
      state.sections[key(cb.dataset.m, cb.dataset.s)] = new Date().toISOString();
      save();
      location.hash = cb.dataset.next;
    });
  }

  // module test
  const tf = document.getElementById("testForm");
  if(tf){
    tf.addEventListener("submit", e=>{
      e.preventDefault();
      const m = COURSE[modIndex(tf.dataset.m)];
      const answers = m.test.map((_,i)=>{ const c = tf.querySelector(`input[name="q${i}"]:checked`); return c ? Number(c.value) : null; });
      const missing = answers.findIndex(a=>a===null);
      if(missing>=0){
        document.getElementById("testErr").textContent = `Answer question ${missing+1} before submitting.`;
        tf.querySelector(`input[name="q${missing}"]`).focus();
        return;
      }
      const wrong = answers.map((a,i)=>a===m.test[i].a?null:i).filter(i=>i!==null);
      const sc = m.test.length - wrong.length;
      const prev = state.tests[m.id] || {attempts:0};
      state.tests[m.id] = {score:sc, passed: sc/m.test.length >= PASS_MARK, attempts:(prev.attempts||0)+1, wrong, at:new Date().toISOString()};
      save(); render(); window.scrollTo({top:0});
    });
  }

  // project submission
  const pf = document.getElementById("projForm");
  if(pf){
    const m = COURSE[modIndex(pf.dataset.m)];
    const collect = ()=>{
      const checks = m.project.deliverables.map((_,i)=>pf.querySelector(`input[name="d${i}"]`).checked);
      return {checks, repo: pf.repo.value.trim(), notes: pf.notes.value.trim()};
    };
    const reopen = pf.dataset.reopen === "1";
    pf.addEventListener("change", ()=>{
      const prev = state.projects[m.id] || {};
      if(prev.submitted && !reopen) return;
      state.projects[m.id] = reopen ? {...prev, ...collect()} : {...collect(), submitted:false};
      save();
    });
    pf.addEventListener("submit", e=>{
      e.preventDefault();
      const d = collect(), err = document.getElementById("projErr");
      const remaining = d.checks.filter(c=>!c).length;
      if(remaining){ err.textContent = `Tick all deliverables before submitting. ${remaining} still open.`; return; }
      if(!/^https?:\/\/\S+\.\S+/.test(d.repo)){ err.textContent = "Add a full repository link starting with https://."; pf.repo.focus(); return; }
      if(d.notes.length < 20){ err.textContent = "Add a few sentences about what was hardest (at least 20 characters)."; pf.notes.focus(); return; }
      state.projects[m.id] = {...d, submitted:true, at:new Date().toISOString()};
      save(); render(); window.scrollTo({top:0});
    });
  }

  // trainer dashboard controls
  const rf = document.getElementById("rosterFilter");
  if(rf){ rf.addEventListener("input", ()=>{ filterText = rf.value; const pos = rf.selectionStart; render(); const n = document.getElementById("rosterFilter"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }); }
  $app.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click", ()=>{ sortKey = b.dataset.sort; render(); }));
  const csv = document.getElementById("csvBtn");
  if(csv){ csv.addEventListener("click", async ()=>{
    const msg = document.getElementById("csvMsg");
    try{
      const dl = await window.claude.use("downloads");
      if(!dl){ msg.textContent = "Downloads aren't available in this view."; return; }
      const res = await dl.save({filename:`course-progress-${new Date().toISOString().slice(0,10)}.csv`, data: rosterCsv()});
      msg.textContent = res && res.saved === false ? "Download cancelled." : "CSV saved.";
    }catch(e){ msg.textContent = "The download didn't complete. Try again."; }
  }); }
  $app.querySelectorAll("form[data-review]").forEach(f=>{
    f.addEventListener("submit", async e=>{
      e.preventDefault();
      const err = f.querySelector(".err");
      const status = (f.querySelector('input[name="status"]:checked')||{}).value;
      const feedback = f.feedback.value.trim().slice(0,4000);
      if(!status){ err.textContent = "Choose Approve or Request changes."; return; }
      if(status==="changes" && feedback.length < 10){ err.textContent = "Tell the learner what to change (at least 10 characters)."; f.feedback.focus(); return; }
      const uid = parse().uid;
      const next = JSON.parse(JSON.stringify(reviews[uid] || {}));
      next[f.dataset.review] = {status, feedback, at:new Date().toISOString(), by:myId};
      const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Sending…";
      try{ await dbNs.doc("reviews/" + uid).set(next); reviews[uid] = next; f.feedback.blur(); render(); }
      catch(ex){ btn.disabled = false; btn.textContent = "Send review"; err.textContent = "The review didn't save. Check your connection and try again."; }
    });
  });

  // certificate name
  const nf = document.getElementById("nameForm");
  if(nf){ nf.addEventListener("submit", e=>{ e.preventDefault(); state.learner = nf.learner.value.trim().slice(0,80); save(); render(); }); }
}

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Reset all progress? Completed sections, test results and project submissions will be cleared.")) return;
  state = blank(); writeLocal(); pushRemote(); location.hash = "#/"; render();
});

window.addEventListener("hashchange", ()=>{ render(); window.scrollTo({top:0}); $app.focus({preventScroll:true}); });

state = normalise(readLocal());
render();
connectStore();
</script>
